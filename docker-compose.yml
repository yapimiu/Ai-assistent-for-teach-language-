services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: romana
      POSTGRES_USER: romana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-romana}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romana -d romana"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://romana:${POSTGRES_PASSWORD:-romana}@db:5432/romana
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://romana:${POSTGRES_PASSWORD:-romana}@db:5432/romana
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://romana:${POSTGRES_PASSWORD:-romana}@db:5432/romana
    command: ["python", "-m", "app.bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
