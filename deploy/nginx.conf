# Reverse proxy for the Romana API (host nginx -> docker api on 127.0.0.1:8000).
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/romana
#          sudo ln -s /etc/nginx/sites-available/romana /etc/nginx/sites-enabled/romana
#          sudo nginx -t && sudo systemctl reload nginx
# Replace ssl_certificate paths with your Let's Encrypt or other certs.
# Replace example.com with your real domain.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # ACME HTTP-01 challenge for certbot renewals (webroot mode).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    # Replace ssl_certificate paths with your Let's Encrypt or other certs
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Direct answer for external health checks (does not touch the API).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
