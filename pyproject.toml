[project]
name = "romana-b1-tutor"
version = "0.1.0"
description = "Persistent Romanian B1 text tutor"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.15,<4", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.6,<3", "httpx>=0.28,<1"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
